# One command to run Lara in a container:   docker compose up --build
# Put your API keys in a file called .env first (copy .env.example). They are never baked into the image.
services:
  lara:
    build: .
    ports:
      - "7860:7860"
    env_file: .env
    volumes:
      - ./data:/app/data   # keeps the demo database between runs
    restart: "no"
